<!--
  Workforce page hero — right column video snippet
  Replaces the .hero-card stats block with a responsive 16:9 YouTube embed
  of "$850 Billion Cost of Ignoring Experienced Workers" Part 1.
  Paste this into the right column of the hero on /workforce/
-->
<div class="hero-card" style="padding:0;background:transparent;border:none;box-shadow:none;">
  <div style="position:relative;width:100%;padding-bottom:56.25%;height:0;overflow:hidden;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,0.5);">
    <iframe
      src="https://www.youtube.com/embed/JQPtZDvhgs8?rel=0&modestbranding=1"
      title="The $850 Billion Cost of Ignoring Experienced Workers — Part 1"
      frameborder="0"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
      allowfullscreen
      style="position:absolute;top:0;left:0;width:100%;height:100%;border:0;">
    </iframe>
  </div>
</div>
