<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Spot UV Mask — BACK</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Montserrat', sans-serif;
  }
  .card {
    width: 700px;
    height: 400px;
    position: relative;
    overflow: hidden;
    border-radius: 20px;
    background: #FFFFFF;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  /* Gold inset border — spot UV */
  .card::before {
    content: '';
    position: absolute;
    inset: 7px;
    border: 1.5px solid #000000;
    border-radius: 14px;
    pointer-events: none;
    z-index: 2;
  }
  /* Corner accents — spot UV */
  .corner { position: absolute; width: 24px; height: 24px; z-index: 3; }
  .corner::before, .corner::after { content: ''; position: absolute; background: #000000; }
  .corner-tl { top: 7px; left: 7px; }
  .corner-tl::before { top: 0; left: 0; width: 24px; height: 1px; }
  .corner-tl::after { top: 0; left: 0; width: 1px; height: 24px; }
  .corner-tr { top: 7px; right: 7px; }
  .corner-tr::before { top: 0; right: 0; width: 24px; height: 1px; }
  .corner-tr::after { top: 0; right: 0; width: 1px; height: 24px; }
  .corner-bl { bottom: 7px; left: 7px; }
  .corner-bl::before { bottom: 0; left: 0; width: 24px; height: 1px; }
  .corner-bl::after { bottom: 0; left: 0; width: 1px; height: 24px; }
  .corner-br { bottom: 7px; right: 7px; }
  .corner-br::before { bottom: 0; right: 0; width: 24px; height: 1px; }
  .corner-br::after { bottom: 0; right: 0; width: 1px; height: 24px; }

  .back-inner {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    position: relative;
    z-index: 1;
    padding: 0 60px;
    width: 100%;
  }
  .back-mic { margin-bottom: 6px; align-self: center; }
  .back-mic svg { width: 36px; height: 54px; }
  .back-brand {
    font-size: 16px; font-weight: 700; letter-spacing: 1px;
    color: #000; margin-bottom: 4px; align-self: center; text-align: center;
  }
  .back-brand-sub {
    font-size: 16px; font-weight: 600; letter-spacing: 1px;
    color: #000; margin-bottom: 14px; align-self: center; text-align: center;
  }
  /* Tagline is white/italic — NO spot UV */
  .back-tagline { display: none; }
  .back-tagline-rule { display: none; }
  .back-rule {
    width: 80px; height: 1px; background: #000; margin-bottom: 14px;
  }
  .back-bottom {
    display: flex; align-items: flex-start; justify-content: space-between;
    width: 100%; gap: 20px;
  }
  .back-socials {
    display: grid; grid-template-columns: auto 1fr;
    gap: 5px 12px; align-items: baseline; justify-items: start;
  }
  .back-social { display: contents; }
  .back-social .platform {
    font-size: 16px; font-weight: 700; color: #000; letter-spacing: 0.5px;
  }
  .back-social .handle {
    font-size: 16px; font-weight: 500; color: #000;
  }
  .back-qr {
    display: flex; flex-direction: column; align-items: center; flex-shrink: 0;
  }
  .back-qr-box {
    width: 110px; height: 110px; border: 2px solid #000; border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; color: #000; font-weight: 700;
  }
  .qr-label {
    font-size: 10px; font-weight: 600; color: #000;
    letter-spacing: 1.5px; text-transform: uppercase; margin-top: 4px;
  }
</style>
</head>
<body>
<div class="card">
  <div class="corner corner-tl"></div>
  <div class="corner corner-tr"></div>
  <div class="corner corner-bl"></div>
  <div class="corner corner-br"></div>
  <div class="back-inner">
    <div class="back-mic">
      <!-- Mic — spot UV -->
      <svg viewBox="0 0 120 180" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="28" y="10" width="64" height="110" rx="20" fill="#000"/>
        <rect x="34" y="18" width="52" height="94" rx="14" fill="#fff" opacity="0.5"/>
        <line x1="44" y1="28" x2="44" y2="102" stroke="#000" stroke-width="1.2"/>
        <line x1="50" y1="25" x2="50" y2="105" stroke="#000" stroke-width="1.2"/>
        <line x1="56" y1="24" x2="56" y2="106" stroke="#000" stroke-width="1.2"/>
        <line x1="60" y1="23" x2="60" y2="107" stroke="#000" stroke-width="1.5"/>
        <line x1="64" y1="24" x2="64" y2="106" stroke="#000" stroke-width="1.2"/>
        <line x1="70" y1="25" x2="70" y2="105" stroke="#000" stroke-width="1.2"/>
        <line x1="76" y1="28" x2="76" y2="102" stroke="#000" stroke-width="1.2"/>
        <path d="M48,12 Q60,6 72,12" fill="none" stroke="#000" stroke-width="1"/>
        <rect x="30" y="112" width="60" height="6" rx="2" fill="#000"/>
        <path d="M24,50 L24,125 Q24,132 30,132" fill="none" stroke="#000" stroke-width="4" stroke-linecap="round"/>
        <path d="M96,50 L96,125 Q96,132 90,132" fill="none" stroke="#000" stroke-width="4" stroke-linecap="round"/>
        <circle cx="24" cy="50" r="3.5" fill="#000"/>
        <circle cx="96" cy="50" r="3.5" fill="#000"/>
        <rect x="55" y="130" width="10" height="30" rx="5" fill="#000"/>
        <rect x="52" y="130" width="16" height="5" rx="2.5" fill="#000"/>
        <ellipse cx="60" cy="168" rx="30" ry="8" fill="#000"/>
      </svg>
    </div>
    <div class="back-brand">learnmoretechnologies.com/speak</div>
    <div class="back-brand-sub">50+techbridge.com</div>
    <div class="back-rule"></div>
    <div class="back-bottom">
      <div class="back-socials">
        <div class="back-social"><span class="platform">LinkedIn</span><span class="handle">/brianmckinneylmt</span></div>
        <div class="back-social"><span class="platform">YouTube</span><span class="handle">@LearnMoreTechnologies</span></div>
        <div class="back-social"><span class="platform">Facebook</span><span class="handle">/learnmoretechnologies</span></div>
        <div class="back-social"><span class="platform">Instagram</span><span class="handle">@50plustechbridge</span></div>
        <div class="back-social"><span class="platform">Podcast</span><span class="handle">#AGENTIC50</span></div>
      </div>
      <div class="back-qr">
        <div class="back-qr-box">QR AREA</div>
        <span class="qr-label">Scan to book</span>
      </div>
    </div>
  </div>
</div>
</body>
</html>
