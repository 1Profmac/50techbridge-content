<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>RCA 77-DX Style Microphone — Edward R. Murrow</title>
<style>
  body {
    background: #0E1C2F;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    gap: 80px;
    padding: 40px;
  }
  .mic-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  .mic-label {
    color: #556;
    font-family: sans-serif;
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
  }
</style>
</head>
<body>

<!-- LARGE -->
<div class="mic-wrapper">
  <div class="mic-label">Large — 200px</div>
  <svg width="120" height="200" viewBox="0 0 120 220" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="body" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#A07020"/>
        <stop offset="20%" stop-color="#E8C55A"/>
        <stop offset="45%" stop-color="#C8942E"/>
        <stop offset="70%" stop-color="#E0B84E"/>
        <stop offset="100%" stop-color="#9A6A1C"/>
      </linearGradient>
      <linearGradient id="yokeG" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#8A6018"/>
        <stop offset="50%" stop-color="#C8942E"/>
        <stop offset="100%" stop-color="#8A6018"/>
      </linearGradient>
      <linearGradient id="standG" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#C8942E"/>
        <stop offset="100%" stop-color="#7A5515"/>
      </linearGradient>
      <linearGradient id="baseG" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#B8862E"/>
        <stop offset="100%" stop-color="#6A4A10"/>
      </linearGradient>
    </defs>

    <!-- === MIC BODY — Art Deco pill/tombstone shape === -->
    <!-- Outer shell -->
    <rect x="28" y="10" width="64" height="110" rx="20" fill="url(#body)" />

    <!-- Inner grille recessed area -->
    <rect x="34" y="18" width="52" height="94" rx="14" fill="#0E1C2F" opacity="0.5"/>

    <!-- Grille face plate -->
    <rect x="36" y="20" width="48" height="90" rx="12" fill="none" stroke="#C8942E" stroke-width="1" opacity="0.6"/>

    <!-- Vertical grille slots — the signature look -->
    <line x1="44" y1="28" x2="44" y2="102" stroke="#C8942E" stroke-width="1.2" opacity="0.5"/>
    <line x1="50" y1="25" x2="50" y2="105" stroke="#C8942E" stroke-width="1.2" opacity="0.5"/>
    <line x1="56" y1="24" x2="56" y2="106" stroke="#C8942E" stroke-width="1.2" opacity="0.6"/>
    <line x1="60" y1="23" x2="60" y2="107" stroke="#E0B84E" stroke-width="1.5" opacity="0.7"/>
    <line x1="64" y1="24" x2="64" y2="106" stroke="#C8942E" stroke-width="1.2" opacity="0.6"/>
    <line x1="70" y1="25" x2="70" y2="105" stroke="#C8942E" stroke-width="1.2" opacity="0.5"/>
    <line x1="76" y1="28" x2="76" y2="102" stroke="#C8942E" stroke-width="1.2" opacity="0.5"/>

    <!-- Horizontal accent bands -->
    <line x1="34" y1="40" x2="86" y2="40" stroke="#E0B84E" stroke-width="0.6" opacity="0.3"/>
    <line x1="34" y1="65" x2="86" y2="65" stroke="#E0B84E" stroke-width="0.6" opacity="0.3"/>
    <line x1="34" y1="90" x2="86" y2="90" stroke="#E0B84E" stroke-width="0.6" opacity="0.3"/>

    <!-- Top cap highlight -->
    <path d="M48,12 Q60,6 72,12" fill="none" stroke="#E8C55A" stroke-width="1" opacity="0.5"/>

    <!-- Bottom cap band -->
    <rect x="30" y="112" width="60" height="6" rx="2" fill="url(#body)" opacity="0.9"/>
    <line x1="32" y1="115" x2="88" y2="115" stroke="#E8C55A" stroke-width="0.5" opacity="0.4"/>

    <!-- === YOKE / FORK MOUNT === -->
    <!-- Left arm -->
    <path d="M24,50 L24,125 Q24,132 30,132" fill="none" stroke="url(#yokeG)" stroke-width="4" stroke-linecap="round"/>
    <!-- Right arm -->
    <path d="M96,50 L96,125 Q96,132 90,132" fill="none" stroke="url(#yokeG)" stroke-width="4" stroke-linecap="round"/>
    <!-- Pivot bolts -->
    <circle cx="24" cy="50" r="3.5" fill="#C8942E" stroke="#8A6018" stroke-width="1"/>
    <circle cx="96" cy="50" r="3.5" fill="#C8942E" stroke="#8A6018" stroke-width="1"/>
    <circle cx="24" cy="50" r="1.2" fill="#0E1C2F"/>
    <circle cx="96" cy="50" r="1.2" fill="#0E1C2F"/>

    <!-- === STAND / NECK === -->
    <rect x="55" y="130" width="10" height="40" rx="5" fill="url(#standG)"/>
    <!-- Collar ring -->
    <rect x="52" y="130" width="16" height="5" rx="2.5" fill="url(#body)"/>
    <!-- Neck ring detail -->
    <rect x="53" y="155" width="14" height="3" rx="1.5" fill="#C8942E" opacity="0.5"/>

    <!-- === BASE === -->
    <ellipse cx="60" cy="178" rx="32" ry="10" fill="url(#baseG)"/>
    <!-- Base top surface -->
    <ellipse cx="60" cy="176" rx="28" ry="7" fill="#B8862E" opacity="0.4"/>
    <!-- Base rim highlight -->
    <ellipse cx="60" cy="174" rx="24" ry="4" fill="none" stroke="#E8C55A" stroke-width="0.5" opacity="0.3"/>
    <!-- Base shadow -->
    <ellipse cx="60" cy="182" rx="30" ry="6" fill="#0E1C2F" opacity="0.5"/>
  </svg>
</div>

<!-- MEDIUM -->
<div class="mic-wrapper">
  <div class="mic-label">Medium — 120px</div>
  <svg width="72" height="120" viewBox="0 0 120 220" xmlns="http://www.w3.org/2000/svg">
    <rect x="28" y="10" width="64" height="110" rx="20" fill="url(#body)" />
    <rect x="34" y="18" width="52" height="94" rx="14" fill="#0E1C2F" opacity="0.5"/>
    <rect x="36" y="20" width="48" height="90" rx="12" fill="none" stroke="#C8942E" stroke-width="1" opacity="0.6"/>
    <line x1="44" y1="28" x2="44" y2="102" stroke="#C8942E" stroke-width="1.2" opacity="0.5"/>
    <line x1="50" y1="25" x2="50" y2="105" stroke="#C8942E" stroke-width="1.2" opacity="0.5"/>
    <line x1="56" y1="24" x2="56" y2="106" stroke="#C8942E" stroke-width="1.2" opacity="0.6"/>
    <line x1="60" y1="23" x2="60" y2="107" stroke="#E0B84E" stroke-width="1.5" opacity="0.7"/>
    <line x1="64" y1="24" x2="64" y2="106" stroke="#C8942E" stroke-width="1.2" opacity="0.6"/>
    <line x1="70" y1="25" x2="70" y2="105" stroke="#C8942E" stroke-width="1.2" opacity="0.5"/>
    <line x1="76" y1="28" x2="76" y2="102" stroke="#C8942E" stroke-width="1.2" opacity="0.5"/>
    <line x1="34" y1="40" x2="86" y2="40" stroke="#E0B84E" stroke-width="0.6" opacity="0.3"/>
    <line x1="34" y1="65" x2="86" y2="65" stroke="#E0B84E" stroke-width="0.6" opacity="0.3"/>
    <line x1="34" y1="90" x2="86" y2="90" stroke="#E0B84E" stroke-width="0.6" opacity="0.3"/>
    <path d="M48,12 Q60,6 72,12" fill="none" stroke="#E8C55A" stroke-width="1" opacity="0.5"/>
    <rect x="30" y="112" width="60" height="6" rx="2" fill="url(#body)" opacity="0.9"/>
    <line x1="32" y1="115" x2="88" y2="115" stroke="#E8C55A" stroke-width="0.5" opacity="0.4"/>
    <path d="M24,50 L24,125 Q24,132 30,132" fill="none" stroke="url(#yokeG)" stroke-width="4" stroke-linecap="round"/>
    <path d="M96,50 L96,125 Q96,132 90,132" fill="none" stroke="url(#yokeG)" stroke-width="4" stroke-linecap="round"/>
    <circle cx="24" cy="50" r="3.5" fill="#C8942E" stroke="#8A6018" stroke-width="1"/>
    <circle cx="96" cy="50" r="3.5" fill="#C8942E" stroke="#8A6018" stroke-width="1"/>
    <circle cx="24" cy="50" r="1.2" fill="#0E1C2F"/>
    <circle cx="96" cy="50" r="1.2" fill="#0E1C2F"/>
    <rect x="55" y="130" width="10" height="40" rx="5" fill="url(#standG)"/>
    <rect x="52" y="130" width="16" height="5" rx="2.5" fill="url(#body)"/>
    <rect x="53" y="155" width="14" height="3" rx="1.5" fill="#C8942E" opacity="0.5"/>
    <ellipse cx="60" cy="178" rx="32" ry="10" fill="url(#baseG)"/>
    <ellipse cx="60" cy="176" rx="28" ry="7" fill="#B8862E" opacity="0.4"/>
    <ellipse cx="60" cy="174" rx="24" ry="4" fill="none" stroke="#E8C55A" stroke-width="0.5" opacity="0.3"/>
    <ellipse cx="60" cy="182" rx="30" ry="6" fill="#0E1C2F" opacity="0.5"/>
  </svg>
</div>

<!-- SMALL — icon size -->
<div class="mic-wrapper">
  <div class="mic-label">Small — 60px</div>
  <svg width="36" height="60" viewBox="0 0 120 220" xmlns="http://www.w3.org/2000/svg">
    <rect x="28" y="10" width="64" height="110" rx="20" fill="url(#body)" />
    <rect x="34" y="18" width="52" height="94" rx="14" fill="#0E1C2F" opacity="0.5"/>
    <line x1="50" y1="25" x2="50" y2="105" stroke="#C8942E" stroke-width="1.5" opacity="0.5"/>
    <line x1="56" y1="24" x2="56" y2="106" stroke="#C8942E" stroke-width="1.5" opacity="0.6"/>
    <line x1="60" y1="23" x2="60" y2="107" stroke="#E0B84E" stroke-width="2" opacity="0.7"/>
    <line x1="64" y1="24" x2="64" y2="106" stroke="#C8942E" stroke-width="1.5" opacity="0.6"/>
    <line x1="70" y1="25" x2="70" y2="105" stroke="#C8942E" stroke-width="1.5" opacity="0.5"/>
    <rect x="30" y="112" width="60" height="6" rx="2" fill="url(#body)" opacity="0.9"/>
    <path d="M24,50 L24,125 Q24,132 30,132" fill="none" stroke="url(#yokeG)" stroke-width="5" stroke-linecap="round"/>
    <path d="M96,50 L96,125 Q96,132 90,132" fill="none" stroke="url(#yokeG)" stroke-width="5" stroke-linecap="round"/>
    <circle cx="24" cy="50" r="4" fill="#C8942E"/>
    <circle cx="96" cy="50" r="4" fill="#C8942E"/>
    <rect x="55" y="130" width="10" height="40" rx="5" fill="url(#standG)"/>
    <rect x="52" y="130" width="16" height="5" rx="2.5" fill="url(#body)"/>
    <ellipse cx="60" cy="178" rx="32" ry="10" fill="url(#baseG)"/>
    <ellipse cx="60" cy="182" rx="30" ry="6" fill="#0E1C2F" opacity="0.5"/>
  </svg>
</div>

<!-- ON WHITE -->
<div class="mic-wrapper" style="background:#fff; padding:40px; border-radius:16px;">
  <div class="mic-label" style="color:#999;">On White</div>
  <svg width="120" height="200" viewBox="0 0 120 220" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="bodyDk" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#0a1420"/>
        <stop offset="20%" stop-color="#1a3050"/>
        <stop offset="45%" stop-color="#0E1C2F"/>
        <stop offset="70%" stop-color="#1a3050"/>
        <stop offset="100%" stop-color="#0a1420"/>
      </linearGradient>
      <linearGradient id="yokeDk" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#081018"/>
        <stop offset="50%" stop-color="#0E1C2F"/>
        <stop offset="100%" stop-color="#081018"/>
      </linearGradient>
    </defs>
    <rect x="28" y="10" width="64" height="110" rx="20" fill="url(#bodyDk)" />
    <rect x="34" y="18" width="52" height="94" rx="14" fill="#ffffff" opacity="0.15"/>
    <rect x="36" y="20" width="48" height="90" rx="12" fill="none" stroke="#0E1C2F" stroke-width="1" opacity="0.3"/>
    <line x1="44" y1="28" x2="44" y2="102" stroke="#C8942E" stroke-width="1.2" opacity="0.4"/>
    <line x1="50" y1="25" x2="50" y2="105" stroke="#C8942E" stroke-width="1.2" opacity="0.4"/>
    <line x1="56" y1="24" x2="56" y2="106" stroke="#C8942E" stroke-width="1.2" opacity="0.5"/>
    <line x1="60" y1="23" x2="60" y2="107" stroke="#C8942E" stroke-width="1.5" opacity="0.6"/>
    <line x1="64" y1="24" x2="64" y2="106" stroke="#C8942E" stroke-width="1.2" opacity="0.5"/>
    <line x1="70" y1="25" x2="70" y2="105" stroke="#C8942E" stroke-width="1.2" opacity="0.4"/>
    <line x1="76" y1="28" x2="76" y2="102" stroke="#C8942E" stroke-width="1.2" opacity="0.4"/>
    <line x1="34" y1="40" x2="86" y2="40" stroke="#C8942E" stroke-width="0.6" opacity="0.2"/>
    <line x1="34" y1="65" x2="86" y2="65" stroke="#C8942E" stroke-width="0.6" opacity="0.2"/>
    <line x1="34" y1="90" x2="86" y2="90" stroke="#C8942E" stroke-width="0.6" opacity="0.2"/>
    <path d="M48,12 Q60,6 72,12" fill="none" stroke="#C8942E" stroke-width="1" opacity="0.3"/>
    <rect x="30" y="112" width="60" height="6" rx="2" fill="url(#bodyDk)" opacity="0.9"/>
    <path d="M24,50 L24,125 Q24,132 30,132" fill="none" stroke="url(#yokeDk)" stroke-width="4" stroke-linecap="round"/>
    <path d="M96,50 L96,125 Q96,132 90,132" fill="none" stroke="url(#yokeDk)" stroke-width="4" stroke-linecap="round"/>
    <circle cx="24" cy="50" r="3.5" fill="#0E1C2F" stroke="#C8942E" stroke-width="0.8"/>

</div>

</body>
</html>
