<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>#AGENTIC50 Logo Stamp</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #060d17;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Montserrat', sans-serif;
    gap: 80px;
    padding: 60px;
  }
  .stamp-label {
    color: #445;
    font-size: 10px;
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-bottom: 12px;
    font-weight: 500;
  }
  .stamp-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .row {
    display: flex;
    gap: 80px;
    align-items: flex-start;
  }
</style>
</head>
<body>

<!-- Shared SVG defs -->
<svg xmlns="http://www.w3.org/2000/svg" style="position:absolute;width:0;height:0">
  <defs>
    <linearGradient id="g1" x1="250" y1="30" x2="250" y2="470" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E8C55A"/>
      <stop offset="50%" stop-color="#C8942E"/>
      <stop offset="100%" stop-color="#A07020"/>
    </linearGradient>
    <linearGradient id="mB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#A07020"/>
      <stop offset="20%" stop-color="#E8C55A"/>
      <stop offset="45%" stop-color="#C8942E"/>
      <stop offset="70%" stop-color="#E0B84E"/>
      <stop offset="100%" stop-color="#9A6A1C"/>
    </linearGradient>
    <linearGradient id="mY" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8A6018"/>
      <stop offset="50%" stop-color="#C8942E"/>
      <stop offset="100%" stop-color="#8A6018"/>
    </linearGradient>
    <linearGradient id="mS" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C8942E"/>
      <stop offset="100%" stop-color="#7A5515"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Navy mic body for white bg version -->
    <linearGradient id="mBd" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0a1420"/>
      <stop offset="20%" stop-color="#1a3050"/>
      <stop offset="45%" stop-color="#0E1C2F"/>
      <stop offset="70%" stop-color="#1a3050"/>
      <stop offset="100%" stop-color="#0a1420"/>
    </linearGradient>
    <linearGradient id="mYd" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#081018"/>
      <stop offset="50%" stop-color="#0E1C2F"/>
      <stop offset="100%" stop-color="#081018"/>
    </linearGradient>
  </defs>
</svg>

<!-- ==================== HERO — ON NAVY ==================== -->
<div class="stamp-wrapper">
  <div class="stamp-label">On Navy</div>
  <svg width="500" height="500" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">

    <!-- Rings -->
    <circle cx="250" cy="250" r="230" fill="none" stroke="url(#g1)" stroke-width="2.5"/>
    <circle cx="250" cy="250" r="210" fill="none" stroke="url(#g1)" stroke-width="0.5" opacity="0.2"/>
    <circle cx="250" cy="250" r="190" fill="none" stroke="url(#g1)" stroke-width="1.5" opacity="0.6"/>

    <!-- Diamond accents -->
    <polygon points="250,14 256,22 250,30 244,22" fill="#C8942E" filter="url(#glow)"/>
    <polygon points="250,470 256,478 250,486 244,478" fill="#C8942E" filter="url(#glow)"/>
    <polygon points="14,250 22,244 30,250 22,256" fill="#C8942E" filter="url(#glow)"/>
    <polygon points="470,250 478,244 486,250 478,256" fill="#C8942E" filter="url(#glow)"/>

    <!-- Dot accents at 45-degree positions -->
    <circle cx="413" cy="87" r="2.5" fill="#C8942E" opacity="0.5"/>
    <circle cx="87" cy="87" r="2.5" fill="#C8942E" opacity="0.5"/>
    <circle cx="413" cy="413" r="2.5" fill="#C8942E" opacity="0.5"/>
    <circle cx="87" cy="413" r="2.5" fill="#C8942E" opacity="0.5"/>

    <!-- Curved text — top -->
    <path id="tP" d="M 55,250 A 195,195 0 0,1 445,250" fill="none"/>
    <text font-family="Montserrat, sans-serif" fill="#C8942E" font-size="13" font-weight="600" letter-spacing="8" opacity="0.7">
      <textPath href="#tP" startOffset="50%" text-anchor="middle">THE PIONEERS PODCAST</textPath>
    </text>

    <!-- Curved text — bottom -->
    <path id="bP" d="M 445,250 A 195,195 0 0,1 55,250" fill="none"/>
    <text font-family="Montserrat, sans-serif" fill="#C8942E" font-size="13" font-weight="600" letter-spacing="8" opacity="0.7">
      <textPath href="#bP" startOffset="50%" text-anchor="middle">50+TECHBRIDGE  ·  LMT</textPath>
    </text>

    <!-- ===== RCA 77-DX MICROPHONE — centered in upper area ===== -->
    <g transform="translate(250, 185) scale(0.65)">
      <!-- Body -->
      <rect x="-32" y="-75" width="64" height="110" rx="20" fill="url(#mB)" />
      <rect x="-26" y="-67" width="52" height="94" rx="14" fill="#0E1C2F" opacity="0.5"/>
      <rect x="-24" y="-65" width="48" height="90" rx="12" fill="none" stroke="#C8942E" stroke-width="1" opacity="0.6"/>
      <!-- Grille slots -->
      <line x1="-16" y1="-57" x2="-16" y2="17" stroke="#C8942E" stroke-width="1.2" opacity="0.5"/>
      <line x1="-10" y1="-60" x2="-10" y2="20" stroke="#C8942E" stroke-width="1.2" opacity="0.5"/>
      <line x1="-4" y1="-61" x2="-4" y2="21" stroke="#C8942E" stroke-width="1.2" opacity="0.6"/>
      <line x1="0" y1="-62" x2="0" y2="22" stroke="#E0B84E" stroke-width="1.5" opacity="0.7"/>
      <line x1="4" y1="-61" x2="4" y2="21" stroke="#C8942E" stroke-width="1.2" opacity="0.6"/>
      <line x1="10" y1="-60" x2="10" y2="20" stroke="#C8942E" stroke-width="1.2" opacity="0.5"/>
      <line x1="16" y1="-57" x2="16" y2="17" stroke="#C8942E" stroke-width="1.2" opacity="0.5"/>
      <!-- Horizontal bands -->
      <line x1="-26" y1="-45" x2="26" y2="-45" stroke="#E0B84E" stroke-width="0.6" opacity="0.3"/>
      <line x1="-26" y1="-20" x2="26" y2="-20" stroke="#E0B84E" stroke-width="0.6" opacity="0.3"/>
      <line x1="-26" y1="5" x2="26" y2="5" stroke="#E0B84E" stroke-width="0.6" opacity="0.3"/>
      <!-- Top cap -->
      <path d="M-12,-73 Q0,-79 12,-73" fill="none" stroke="#E8C55A" stroke-width="1" opacity="0.5"/>
      <!-- Bottom band -->
      <rect x="-30" y="27" width="60" height="6" rx="2" fill="url(#mB)" opacity="0.9"/>
      <!-- Yoke -->
      <path d="M-36,-35 L-36,40 Q-36,47 -30,47" fill="none" stroke="url(#mY)" stroke-width="4" stroke-linecap="round"/>
      <path d="M36,-35 L36,40 Q36,47 30,47" fill="none" stroke="url(#mY)" stroke-width="4" stroke-linecap="round"/>
      <!-- Pivot bolts -->
      <circle cx="-36" cy="-35" r="3.5" fill="#C8942E" stroke="#8A6018" stroke-width="1"/>
      <circle cx="36" cy="-35" r="3.5" fill="#C8942E" stroke="#8A6018" stroke-width="1"/>
      <circle cx="-36" cy="-35" r="1.2" fill="#0E1C2F"/>
      <circle cx="36" cy="-35" r="1.2" fill="#0E1C2F"/>
      <!-- Stand -->
      <rect x="-5" y="45" width="10" height="22" rx="5" fill="url(#mS)"/>
      <rect x="-8" y="45" width="16" height="5" rx="2.5" fill="url(#mB)"/>
    </g>

    <!-- #AGENTIC -->
    <text x="250" y="295" text-anchor="middle" font-family="Montserrat, sans-serif" fill="#ffffff" font-size="44" font-weight="900" letter-spacing="5"><tspan fill="#C8942E">#</tspan>AGENTIC</text>

    <!-- Rules flanking 50 -->
    <line x1="165" y1="310" x2="215" y2="310" stroke="#C8942E" stroke-width="0.8" opacity="0.4"/>
    <line x1="285" y1="310" x2="335" y2="310" stroke="#C8942E" stroke-width="0.8" opacity="0.4"/>

    <!-- 50 -->
    <text x="250" y="358" text-anchor="middle" font-family="Montserrat, sans-serif" fill="#C8942E" font-size="58" font-weight="900" letter-spacing="12" filter="url(#glow)">50</text>
  </svg>
</div>
